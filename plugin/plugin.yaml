name: jev-driver
version: 0.1.0
description: "Drive one visible terminal-browser tab with Jev. Requires the terminal-browser program on PATH, not a skill."
author: Marius
kind: standalone
license: MIT
homepage: https://github.com/nedzen/jev-terminal-browser-driver
python_runtime: external
pip_dependencies: []
requires_env:
  - name: TYPESAFE_API_KEY
    description: "TypeSafe key for Jev decisions at api.typesafe.ai."
    url: "https://typesafe.ai"
    secret: true
provides_tools:
  - jev_drive
  - jev_read
config_schema:
  api_key:
    type: secret
    env: TYPESAFE_API_KEY
    label: TypeSafe API key
    description: "Sent as the bearer token to api.typesafe.ai. Not stored in config.yaml."
  debug:
    type: bool
    default: false
    label: Debug overlay
    description: "Show the bottom-right Jev panel on every jev_drive run. The model cannot turn this off."
