name: jev-driver
version: 0.1.0
description: "Drive one visible terminal-browser tab with Jev. Requires the terminal-browser program on PATH, not a skill."
author: Marius
kind: standalone
license: MIT
homepage: https://github.com/nedzen/jev-terminal-browser-driver
python_runtime: external
pip_dependencies: []
requires_env:
  - name: OPENROUTER_API_KEY
    description: "OpenRouter key used for Jev decisions and for text typed into fields."
    url: "https://openrouter.ai/keys"
    secret: true
provides_tools:
  - jev_drive
config_schema:
  debug:
    type: bool
    default: false
    label: Debug overlay
    description: "Show the bottom-right Jev panel on the driven tab: intent, ranked hits, steps, and spend. A jev_drive debug argument still overrides this for one call."
