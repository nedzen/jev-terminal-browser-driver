[project]
name = "wwwdrive"
version = "1.1.0"
description = "Jev-ultrafast agent loop driving terminal-browser via CDP."
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.28,<1", "websocket-client>=1.8,<2"]

[project.scripts]
wwwdrive = "jev_driver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# plugin ships too: jev_driver.cli imports plugin.core.result to build tick rows,
# so a wheel without it would install a console script that cannot start.
packages = ["jev_driver", "plugin"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E302/E305 are preview blank-line rules; without preview=true, select E skips them.
preview = true
select = ["E", "F", "I", "W29"]

[tool.pytest.ini_options]
# scripts/live carries its self-tests beside the runner, so they are on the path
# too: a harness whose tests only run when someone remembers the flag is a
# harness nobody runs the tests of.
testpaths = ["tests", "scripts/live"]
