[project]
name = "wwwdrive"
version = "1.0.0"
description = "Jev-ultrafast agent loop driving terminal-browser via CDP."
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.28,<1", "websocket-client>=1.8,<2"]

[project.scripts]
wwwdrive = "jev_driver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_driver"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
