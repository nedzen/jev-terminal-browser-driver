[project]
name = "wwwdrive"
version = "1.1.0"
description = "Jev-ultrafast agent loop driving terminal-browser via CDP."
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.28,<1", "websocket-client>=1.8,<2"]

[project.scripts]
wwwdrive = "jev_driver.cli:main"
wwwdrive-mcp = "jev_driver.mcp:main"
wwwdrive-read = "jev_driver.read_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Agent state and lab material must never ship: a wheel built from a working
# tree picked up plugin/.crush/crush.db and its logs before this list existed.
exclude = [
  "plugin/.crush",
  "plugin/.cursor",
  "**/__pycache__",
  "**/*.pyc",
  ".venv",
  ".pytest_cache",
  ".ruff_cache",
  "tests",
  "fixtures",
  "docs",
  "scripts/live",
]

[tool.hatch.build.targets.wheel]
# plugin ships too: jev_driver.cli imports plugin.core.result to build tick rows,
# so a wheel without it would install a console script that cannot start.
packages = ["jev_driver", "plugin"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E302/E305 are preview blank-line rules; without preview=true, select E skips them.
preview = true
select = ["E", "F", "I", "W29"]

[tool.pytest.ini_options]
# `tests/` is the product suite and the default gate. The live harness carries
# its own self-tests beside the runner under scripts/live; they are a separate,
# optional command (`uv run pytest scripts/live`) so the product gate stays fast
# and its failures stay readable. AGENTS.md names both commands.
testpaths = ["tests"]
